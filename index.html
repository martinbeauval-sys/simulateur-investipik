<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#18212b;--muted:#5d6b78;--line:#d9e0e6;--accent:#1d5c63;--loss:#b23a3a}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 "Helvetica Neue",Arial,sans-serif;padding:0 16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:100%;max-width:360px;display:grid;gap:12px}
h1{font-size:20px;margin:0}p{margin:0;color:var(--muted);font-size:13px}
input{font:16px monospace;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button{font:600 15px inherit;padding:10px;border:0;border-radius:6px;background:var(--accent);color:var(--surface);cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--loss)}
</style></head><body>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function open_(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
  var html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem("ipk",pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async function(e){
  e.preventDefault();var m=document.getElementById("m");m.className="";m.textContent="Ouverture…";
  try{await open_(document.getElementById("pw").value)}catch(err){m.className="err";m.textContent="Mot de passe incorrect. Vérifie les majuscules et les tirets."}
});
try{var s=sessionStorage.getItem("ipk");if(s)open_(s).catch(function(){})}catch(e){}
